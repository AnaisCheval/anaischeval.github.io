    <ellipse cx="760" cy="260" rx="560" ry="170" transform="rotate(-22 760 260)"/>
    <ellipse cx="760" cy="260" rx="430" ry="300" transform="rotate(35 760 260)"/>
    <circle cx="760" cy="260" r="120" stroke-opacity="0.08"/>
  </g>
  <!-- On the second orbit, in the right margin of the page at common screen widths. -->
  <circle cx="801" cy="599" r="4" fill="#f0b44c" fill-opacity="0.55"/>
</svg>
